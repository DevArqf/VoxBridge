name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:syntax
      - run: npm test
        env:
          DISCORD_TOKEN: test-discord-token-1234567890
          DISCORD_CLIENT_ID: '123456789012345678'
          DEEPL_AUTH_KEY: test-deepl-key:fx
          TARGET_VOICE_LANG: EN
          DB_PATH: ./test-ci.db
